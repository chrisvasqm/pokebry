# Hashed build output under /assets/ is cached forever; everything else revalidates.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # Prefer the .gz files written at build time; compress on the fly only what has none.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $cache_control;

    # Static files: serve or 404, never fall back to index.html.
    location ~* \.(js|css|map|png|jpg|jpeg|gif|svg|ico|webp|json|txt|woff2?)$ {
        try_files $uri =404;
    }

    # App routes: SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
