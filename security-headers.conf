add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com; media-src https://raw.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://pokeapi.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
